<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // 0. Neutralize Vite dev-server HMR WebSocket in cloud preview environments where port 24678 is not open
      (function () {
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            var isViteHmr = function (url, protocols) {
              var urlStr = String(url || '').toLowerCase();
              var protoStr = String(protocols || '').toLowerCase();
              return (
                protoStr.indexOf('vite-hmr') !== -1 ||
                urlStr.indexOf('token=') !== -1 ||
                urlStr.indexOf('24678') !== -1 ||
                urlStr.indexOf('vite') !== -1
              );
            };

            var createMockSocket = function (url, protocols) {
              var target = new EventTarget();
              target.url = String(url || '');
              target.protocol = Array.isArray(protocols) ? protocols[0] : String(protocols || '');
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.send = function () {};
              target.close = function () {
                target.readyState = 3;
                target.dispatchEvent(new Event('close'));
              };
              setTimeout(function () {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            };

            var ProxiedWebSocket = function (url, protocols) {
              if (isViteHmr(url, protocols)) {
                return createMockSocket(url, protocols);
              }
              return new OrigWebSocket(url, protocols);
            };

            ProxiedWebSocket.CONNECTING = 0;
            ProxiedWebSocket.OPEN = 1;
            ProxiedWebSocket.CLOSING = 2;
            ProxiedWebSocket.CLOSED = 3;
            ProxiedWebSocket.prototype = OrigWebSocket.prototype;

            window.WebSocket = ProxiedWebSocket;
          }
        } catch (_) {}
      })();

      // 1. Ensure window.fetch has both getter and setter so browser extensions (e.g. request interceptors)
      // can safely wrap it without throwing "Cannot set property fetch of #<Window> which has only a getter"
      (function () {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _origFetch;
            },
            set: function (newFetch) {
              _origFetch = newFetch;
            }
          });
        } catch (_) {}
      })();

      // 2. Filter out noisy extension errors and Vite dev server WebSocket disconnect notices
      (function () {
        var isIgnoredError = function (msg, filename, stack) {
          var str = (String(msg || '') + ' ' + String(filename || '') + ' ' + String(stack || '')).toLowerCase();
          return (
            str.indexOf('cannot set property fetch') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('websocket closed without opened') !== -1 ||
            (str.indexOf('[vite]') !== -1 && str.indexOf('websocket') !== -1)
          );
        };

        window.addEventListener(
          'error',
          function (e) {
            if (e && isIgnoredError(e.message, e.filename, e.error && e.error.stack)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && (e.reason && (e.reason.message || e.reason.stack || e.reason));
            if (isIgnoredError(reason)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );

        // Also wrap console.error to silence Vite client WebSocket closure and extension errors
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var fullMsg = args
            .map(function (a) {
              return String((a && (a.message || a.stack || a)) || '');
            })
            .join(' ');
          if (isIgnoredError(fullMsg)) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>

    <meta property="og:description" content="Comprehensive parental control platform with screen time limits, AI web & app content filtering, live location tracking with geofences, child device sync, and digital safety insights." />

    <link rel="manifest" href="/manifest.json" />
